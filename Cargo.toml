[package]
name = "tm"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
libc = "0.2"
rustix = { version = "1.1.4", features = ["termios"] }
vt100 = "0.16.2"

[dev-dependencies]
laputa-ptytest = "0.1"

[[bin]]
name = "tm"
path = "src/main.rs"

# A deterministic child process for the real-PTY integration tests. Keeping
# this fixture as a binary avoids making the tests depend on shell buffering,
# startup behavior, or a platform's `script` implementation.
[[bin]]
name = "tm-pty-fixture"
path = "tests/support/pty_fixture.rs"

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
