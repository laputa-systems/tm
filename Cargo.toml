[package]
name = "tm"
version = "0.0.0"
edition = "2024"
description = "A small Unix-only tmux-style terminal multiplexer"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
rustc-hash = "2"
rustix = { version = "1.1.4", features = ["termios"] }
unicode-width = "0.2"
vt100 = "0.18.1"

[dev-dependencies]
laputa-ptytest = "0.4"
rustybench = "0.4"

[features]
parity = []

[[bin]]
name = "tm"
path = "src/main.rs"

# A deterministic child process for the real-PTY integration tests. Keeping
# this fixture as a binary avoids making the tests depend on shell buffering,
# startup behavior, or a platform's `script` implementation.
[[bin]]
name = "tm-pty-fixture"
path = "tests/support/pty_fixture.rs"

[[test]]
name = "tmux_parity"
path = "tests/tmux_parity.rs"
required-features = ["parity"]

[[test]]
name = "tmux_histories"
path = "tests/tmux_histories.rs"
required-features = ["parity"]

[[test]]
name = "tmux_unicode_history"
path = "tests/tmux_unicode_history.rs"
required-features = ["parity"]

[[test]]
name = "tmux_bindings"
path = "tests/tmux_bindings.rs"
required-features = ["parity"]

[[test]]
name = "tmux_option_rows"
path = "tests/tmux_option_rows.rs"
required-features = ["parity"]

[[test]]
name = "tmux_mode_rows"
path = "tests/tmux_mode_rows.rs"
required-features = ["parity"]

[[test]]
name = "tmux_lifecycle_rows"
path = "tests/tmux_lifecycle_rows.rs"
required-features = ["parity"]

[[bench]]
name = "tm_performance"
path = "benches/tm_performance.rs"
harness = false

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
