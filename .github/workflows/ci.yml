name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04-arm, xcode-27]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: laputa-systems/buildlib/setup@4ed2e0a1e0a5d23911ffccdd97349d30a7885f01 # v0.3.2
        if: runner.os == 'Linux'
        with:
          tools: llvm
          lock: .github/tools.lock.json
      - name: Install Linux reference dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6-dev make libevent-dev libncurses-dev libutf8proc-dev \
            pkg-config vim less
      - name: Link cc to owned clang
        if: runner.os == 'Linux'
        run: sudo ln -sf "$(command -v clang)" /usr/local/bin/cc
      - name: Install macOS reference dependencies
        if: runner.os == 'macOS'
        run: brew install libevent utf8proc pkg-config
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .work/ref
          key: tmux-ref-${{ runner.os }}-${{ hashFiles('tests/support/install-tmux-ref.sh') }}
      - name: Install tmux reference
        run: tests/support/install-tmux-ref.sh
      - name: Test
        run: make test
      - name: Parity
        run: make parity
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-failures-${{ runner.os }}
          path: |
            target/ptytest-failures
            .work/tmp/*.log
          if-no-files-found: ignore
