# tmux 3.8 reference profile for tm's compiled normal profile.
# tests/reference/profile.rs checks this file against src/config.rs.
set -s buffer-limit 50
set -s default-terminal 'tmux-256color'
set -s terminal-features 'tmux-256color:Sync:clipboard'
set -s set-clipboard 'external'
set -s extended-keys 'on'
set -s extended-keys-format 'csi-u'
set -s escape-time '0'
set -s focus-events 'on'
set -g base-index '1'
set -g bell-action 'any'
set -g history-limit '10000'
set -g mouse 'on'
set -g prefix 'C-a'
set -g renumber-windows 'on'
set -g set-titles 'off'
set -g status-bg 'black'
set -g status-fg 'white'
set -g status-left '#{?client_prefix,#[fg=yellow],}(#S) '
set -g status-left-length '32'
set -g status-position 'bottom'
set -g status-right ''
set -g visual-bell 'off'
set -gw automatic-rename 'off'
set -gw mode-keys 'emacs'
set -gw monitor-activity 'off'
set -gw monitor-bell 'on'
set -gw window-status-current-format '#[fg=green]#I:#W#{?window_zoomed_flag, (Z),}'
set -gw window-status-format '#[dim]#I:#W#{?window_zoomed_flag, (Z),}'
unbind -a -T prefix
bind -T prefix 'd' 'detach-client'
bind -T prefix 'c' 'new-window'
bind -T prefix 'n' 'command-prompt' '-p' 'name of new window:' "new-window -n '%%'"
bind -T prefix 'p' 'display-panes'
bind -T prefix '%' 'split-window' '-h'
bind -T prefix '"' 'split-window' '-v'
bind -T prefix 'x' 'kill-pane'
bind -T prefix '&' 'kill-window'
bind -T prefix 'h' 'select-pane' '-L'
bind -T prefix 'j' 'select-pane' '-D'
bind -T prefix 'k' 'kill-pane' \; 'display' 'pane killed.'
bind -T prefix 'l' 'select-pane' '-R'
bind -T prefix '[' 'copy-mode'
bind -T prefix 'b' 'send-prefix'
bind -T prefix 'Enter' 'display' 'tm configuration is compiled in.'
bind -T prefix 'C-s' 'send-keys' '-N' '2' 'C-a'
bind -T prefix '/' 'command-prompt'
bind -T prefix 'r' 'command-prompt' '-p' 'rename window:' "rename-window '%%'"
bind -r -T prefix 'C-Left' 'previous-window'
bind -r -T prefix 'C-Right' 'next-window'
bind -r -T prefix 'Left' 'swap-window' '-t' '-1' \; 'select-window' '-t' '-1'
bind -r -T prefix 'Right' 'swap-window' '-t' '+1' \; 'select-window' '-t' '+1'
bind -T prefix '\' 'split-window' '-h' '-c' '#{pane_current_path}' \; 'select-layout' 'even-horizontal'
bind -T prefix '-' 'split-window' '-v' '-c' '#{pane_current_path}' \; 'select-layout' 'even-vertical'
bind -T prefix 'z' 'resize-pane' '-Z'
bind -T prefix 'm' 'command-prompt' '-p' 'move pane to window #:' "join-pane -h -t '%%'"
bind -r -T prefix 'C-n' 'break-pane' '-t' ':'
